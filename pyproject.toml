[project]
name = "plan-my-day-agent"
version = "0.1.0"
description = "An agentic system that plans my day on Google Calendar for me and dynamically modifies it on demand."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=3.4.5",
    "google-api-python-client>=2.198.0",
    "google-auth-httplib2>=0.4.0",
    "google-auth-oauthlib>=1.4.0",
    "langchain>=1.3.14",
    "langchain-mcp-adapters>=0.3.1",
    "langchain-ollama>=1.1.0",
    "python-dotenv>=1.2.2",
    "rich>=13.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.2",
]
